name: Satranç Akademisi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-verify:
    name: Lint, Typecheck, Unit Tests & Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript strict typecheck (lint)
        run: npm run typecheck

      - name: Run Vitest unit test suite
        run: npm test

      - name: Build production web bundle
        run: npm run build

  macos-desktop-verify:
    name: Tauri 2 macOS Desktop Build Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri macOS .app and .dmg
        run: npm run tauri:build
